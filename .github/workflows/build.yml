name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          # Käännösvirheet näkyviin annotaatioina (e: ...)
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -60 | sed 's/^/::error::/'
            exit 1
          }
      - name: Check migration SQL
        run: python3 .github/scripts/check_schema.py
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Treenipaivakirja.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Treenipaivakirja-apk
          path: Treenipaivakirja.apk
      # Julkaisu (ja puhelimen päivitysilmoitus) vain main-haarasta
      - name: Publish release (direct download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Treenipäiväkirja ${{ github.run_number }}
          files: Treenipaivakirja.apk
